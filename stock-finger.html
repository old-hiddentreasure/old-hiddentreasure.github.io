            "sanctuary-finger.md": "# 總綱：四大菩薩操作要義\n\n在股票市場的驚濤駭浪中，交易者往往容易迷失在無窮無盡的指標、籌碼與市場噪音中。為了重塑交易者的內在心法，將投機正法系統性地歸納為**「四大菩薩操作法門」**：\n\n1. **智（智文殊）**：代表「預期世界的構建與價格根本」（屬於分析）。\n2. **仁（悲觀音）**：代表「真實世界的對齊與體感識別」（屬於接受與修正）。\n3. **靜（靜地藏）**：代表「不動如山的部位管理與風險控制」（屬於等待與守成）。\n4. **勇（行普賢）**：代表「關鍵價位的極致出手與執行」（屬於出手與執行）。\n\n以下為四大菩薩的操作要義，是全書心態與實戰操作的總綱領。\n\n---\n\n## 智（智文殊）—— 預期世界的構建與價格根本\n\n> **「價格才是根本，洞悉市場意志所驅動的勢與市。」**\n\n「智文殊」法門屬於**分析階段**。在開盤前，交易者透過客觀數據在腦海中勾勒出一個預期的**「理想世界」**，並在進入真實戰場前完成心態的**「轉念」**。\n\n* **價格根本與意志驅動**：\n  * **價格才是根本**：拋棄所有對外在指標的盲目信仰，一切以價格行為（Price Action）定錨。\n  * **意志、勢、市（市場 82 法則）**：洞悉市場底層由核心意志驅動「勢」，進而形成「市」的傳導鏈。分析並鎖定可能驅動行情、僅占 2 成的關鍵族群。\n* **預期與認知局限**：\n  * **認知永遠不完整**：承認人類對市場的理解必然存在缺陷與盲區，放下「分析萬能」的執念。\n  * **同樣線型不同命運**：破除圖表因果論。一模一樣的技術線型，背後可能走向完全相反的命運，必須以機率思維待之。\n  * **機率優勢（風險報酬不對等優勢）**：不強求高勝率，而是尋找風險極小而潛在利潤極大的不對等機率機會。\n* **策略定錨與思維重塑**：\n  * **雙率思考**：隨時權衡「勝率」與「賺賠比」，以期望值為核心。\n  * **中性思考與灰階原則**：市場不是非黑即白，利多與利空之間存在大片動態演變的灰色地帶。保持中性，不帶主觀偏見。\n  * **事件兩面性原則**：任何消息或事件都有其雙刃劍性質，不以單一利多或利空進行線性解讀。\n  * **估值重調與節奏轉換**：理解股價暴漲本質上是市場預期共識的集體轉移（Re-rating），並隨時留意市場節奏的動態轉換。\n  * **交易環境分治**：明確區分「獎金選股（波段交易）」與「薪水選股（當沖交易）」在選股邏輯與停損設計上的本質斷層。\n\n---\n\n## 仁與靜（悲觀音、靜地藏）—— 真實世界的對齊、接受與等待\n\n> **「放下自我執著，以真實盤面補足預期世界的不足；不動如山，在等待中守成。」**\n\n「仁觀音」與「靜地藏」法門屬於**接受、修正與等待階段**。當開盤後，交易者必須放下自我的堅持，將腦中的「理想世界」與盤面的「真實世界」反覆疊合、修正，並保持極大的定力進行部位控制。\n\n### 仁（悲觀音）：觀察股價運動價格行為(道氏運動、道氏防線)與真實世界的對齊、體感修正\n\n* **對齊世界與體感識別**：\n  * **換位思考**：從實際盤面的價格行為出發，補足理想預期的不足，建立敏銳的「股票體感識別」。\n  * **接受任何可能性**：預測永遠不完美。必須建立「買進後隨時可能大跌」的防守心理框架，這是保護交易心理素質的關鍵基石。\n  * **族群 82 法則**：用心感受與觀察目前正在盤面上實際驅動行情之 2 成股票與主流族群，放棄自我的主觀堅持。\n* **熟讀亞當理論、看線辦事與強弱比對**：\n  * <span style=\"color: red;\">**亞當理論與優化**：儘量只做賠率順勢盤，放棄勝率震盪盤</span>\n    1. <span style=\"color: red;\">**對市場無條件的無知與臣服**：放棄任何看法，只看價格</span>\n    2. <span style=\"color: red;\">**只做順勢，放棄抓轉折**：會漲的股票到月球也應該買，會跌的股票跌到零也該賣，不要自己抓轉折(市場會幫你抓)，避開震盪，亞當理論不猜頭摸底，所以只有轉折時會錯(設好停損就可，其他都對)</span>\n    3. <span style=\"color: red;\">**做多只做強勢股，做空只做弱勢股**：不去猜測轉折點，但可以考慮雙率，比方說趨勢多方，仍做多，但注意過熱可能反轉，調整部位，賠率若差就減倉，等賠率高的拉回買點，趨勢空，做空，但注意過熱可能反轉，調整部位，賠率若差就減倉，等賠率高的上漲空點，以亞當理論決定多空趨勢，不抓轉折，避開震盪，雙率優化</span>\n  * **看線辦事**：依據共識與結構主義進行價格變動與價格行為的觀察。針對波動、順勢、盤整、大震盪等不同市場狀態，採用截然不同的應對策略：\n    1. **道氏運動看趨勢**：依照道氏運動、防線、反轉型態等辨認多空運動趨勢（運動兩字很重要）或是盤整，多空確立打順勢賠率盤，盤整打逆勢勝率高出低進。\n    2. **過熱、樞紐轉折與關鍵k**：辨識過熱k ➡️ P(樞紐)k(關鍵k)[進入聽牌] ➡️ 胡牌；大樞紐才是轉折（轉折是重點，但儘量略過不要去抓），小樞紐要懂得略過。\n    3. **下單後想著反向**：下單後如果不如預期，馬上反向或以震盪盤處理。\n  * **結構強弱比對**：隨時比對「大盤、熱門族群、自己持股」三者之間的結構強弱。\n  * **時常留意轉強族群**：\n    1. **板蕩識忠臣**：大盤下跌時才是觀察與篩選強勢股的黃金窗口。\n    2. **異常波動識別**：盤中波動突然變大、洗刷愈用力愈代表有大資金運作，但日線卻能守住關鍵支撐點位。\n  * **生存紅線**：股票未站上年線（240 MA）之前，原則上儘量不碰。\n* **進攻性部位管理**：\n  * **汰弱留強與加碼獎勵**：持股必須動態調整，將資金從弱勢、賠錢的股票中撤出，轉而「加碼獎勵」強勢且賺錢的股票。這不僅是防守，更是利用槓桿進行防守反擊的主動進攻。\n\n### 靜（靜地藏）：獨立於情緒外的操作系統、不動如山的守成與精神力\n* **精神力為成敗關鍵**：精神崩潰就會亂做，參考交易憲法，不要全出全進(避免過度交易)，逐漸加倉，換股或零股，都可增加精神負載力\n* **獨立於情緒外的操作系統**：不要跟著市場跑，以為可以預測而做點什麼(過度交易)，而是在想像世界中的賠率高處先掛單，讓真實世界來觸發、貼合與成交，儘量在賠率高處預掛(先設定比較大個空間再視情況微調)，而不是市價買賣(市價買賣是預測感覺型交易，很慘)\n* **杜絕衝動與保持距離**：\n  * **等待的藝術**：交易有 8 成的時間是在等待合適的時機（賺取大波段的「賺獎金」，而非盤中瑣碎的「賺薪水」）。\n  * **禁止盤中隨機交易**：絕不因為盤中價格的隨機起伏而任意買賣、追高殺低。所有的動作必須依照計劃預先掛單完成。\n  * **距離感**：與盤面保持適度距離，避免被短線雜訊干擾心境。\n* **守護利潤與部位控制**：\n  * **未實現利潤的定力**：勿頻繁更換強勢股，深刻理解「未實現利潤比已實現利潤更重要」，給予強勢股足夠的發展空間。\n  * **風險控制原則**：贏加碼，輸撤退。嚴格控管總部位與單筆風險。\n* **停損的藝術（守規與破矩）**：\n  * **無罪推定原則**：在價格未觸及底線紅線前，儘量給予寬容度，避免被隨機洗盤洗出場。\n  * **停損強弱分治**：強勢股停損要寬（容錯空間大），弱勢股停損要窄（苗頭不對即撤退）。\n  * **紀律與彈性的平衡**：停損是極高的藝術。必須死守紀律，但也要保留彈性與容錯空間（例如將停損設於群眾情緒滿溢的波段高低點），不要窒息持股的生命力，亦不放任虧損擴大。\n\n---\n\n## 勇（行普賢）—— 關鍵價位的樞紐出擊與執行\n\n> **「在關鍵的樞紐點鐵血執行，以賠率為主、勝率為輔，果斷出擊。」**\n\n「勇普賢」法門屬於**出手與執行階段**。當盤面出現關鍵信號，交易者必須摒除所有恐懼與猶豫，像外科手術般精準執行下單動作。\n\n* **樞紐點出手與價格 82 法則**：\n  * **價格 82 法則**：交易者一生中 80% 的利潤來自於 20% 的關鍵交易。因此，只在市場「醞釀、攻擊、反殺（出手與停損）、大出擊」的關鍵樞紐點採取行動。\n  * **強勢股拉回出手**：強勢股大漲後，僅在「拉回危險點」的黃金窗口進行防守型買入，以逸待勞。\n* **智慧單的鐵血執行**：\n  * **賠率為主，勝率為輔**：利用智慧單在強勢股的拉回危險點預先掛單買進，以博取極高的賠率。\n  * **弱勢股不買或轉強買**：弱勢股原則上不碰；若要參與，必須設定智慧單在其「站上轉強點」時才觸發買入。\n  * **防守同步**：任何智慧單一旦觸發成交，必須**隨即掛出停損防守單**，堅決執行「有賺不賠」的保本原則。\n* **部位管理與賺賠比極大化**：\n  * **分批進出與汰弱留強**：賠錢單要早早出場以控制虧損；賺錢單則要抱得夠久、晚點出場，並在趨勢確立時進行槓桿加碼，以極大化賺賠比。\n  * **微觀動作管理**：落實「輕倉放大」、「分層出手」、「部位加減碼」等控倉技術。\n  * **關鍵價與波動度監控**：緊盯整數關卡、平盤線、大量區等關鍵支撐壓力價位，並對市場波動度保持高度敏感。\n  * **應急計劃**：在每一次出手前，大腦必須預先想好最壞的情況與對應的應急計劃。\n  * **槓桿應用時機**：槓桿唯一的用途是「放大賺錢的部位」，在有盈利保護且趨勢明朗時果斷擴大戰果，並死守「有賺不能賠」的安全邊際。\n",
            "sanctuary-finger-2.md": "# 流派：轉折派與順勢派\n\n世界上就兩個流派，轉折派跟順勢派：\n\n## 轉折派\n- **特性**：勝率低，賠率高，整天猜頭摸底。\n- **痛點**：因為很難猜，猜對之前常受傷慘重。比如說要猜國巨底部，要剛好猜到極其困難：下影線，買；到月線，買；破季線，買；破半年線，買。只要錢夠，某天一定猜中。\n- **適用對象**：適合投資而非投機，也適合錢多的。\n- **交易修煉**：這個流派必須嚴控部位，練好停損。勝率低，十次中一次，但那一次會大賺。\n- **個性要求**：個性上適合賭徒性格，較聰明，喜歡與眾不同，例如麥克貝瑞。抗壓性要很高，因為轉折都是逆勢。\n\n## 順勢派\n- **特性**：完全臣服市場，放棄猜頭摸底。\n- **預估**：十次會錯兩次，就是頭部與底部會錯過，但 8 次都是對的。\n- **心態**：勝率高，賠率就比較差，只賺波段 50%。也不去問「應該」如何，而是現在「是」如何。\n",
            "sanctuary-finger-3.md": "# 下跌該加碼或減碼？\n\n針對這個問題，不同資金規模的交易者有著截然不同的操作哲學：\n\n## 錢少的交易者\n- **主張**：減碼。\n- **操作方法**：不一定是今天，優先選線型醜的（代表上面套牢賣壓重）先減，因為你不賣，別人會賣。\n- **警語**：但也有可能賣光籌碼乾淨後，主力一路拉上去。股市沒什麼不可能，我們只能選擇機率高的做法。\n\n## 錢多的交易者\n- **主張**：一律投資左側交易。\n- **操作方法**：永遠只有加碼選項，本多終勝。\n\n---\n\n## 總結\n這種問題根本沒有標準答案，說有答案的都是騙子。\n",
            "sanctuary-finger-4.md": "# 亞當理論\n\n(1) **股市「心經」與臣服**：為何說這本書是股市的「心經」？因為它主張我們應該要承認自己對市場無知，並毫無保留地「臣服」於市場。我們要說的不是「應該」會怎樣，而是現在「是」怎樣，這類似於如來藏法門的「轉依」。\n\n(2) **小賠大賺的賺賠比**：就算勝率只有 3 成，只要賠率拉大，長線下來一樣賺錢。\n\n(3) **不猜頭摸底**：不猜頭摸底，不當先知，只會錯兩次（轉折），其他都對，穩穩賺取波段的 50%（有用過熱，P樞紐K關鍵K戰法來優化亞當理論）。\n\n(4) **維持精神力**：抱著遊戲、好玩的心態，而非在極大的心理壓力下進行交易，這樣反而更容易贏錢。\n\n(5) **虧損部位絕不攤平**：這是一切亞當順勢理論的鐵律，絕不攤平虧損部位。\n\n(6) **有部位就不能客觀**：要一直提醒自己屏除所有偏見，包括所有分析、意見等，純粹以市場價格行為為主要觀察指標，看現在「是」什麼，而非現在「應該」怎麼樣，避免主觀武斷（有用先決定週期再決定趨勢來優化，也有傅大士隨緣芭樂價戰法與零股戰法來增加精神力）。\n",
            "sanctuary-finger-5.md": "# 去槓桿不等於上漲保證\n\n有人說融資大減表示跌勢結束，是這樣嗎？\n\n## 融資大減的雙面性\n- **籌碼乾淨**：如果融資大減，籌碼流到大戶手中，這代表籌碼變乾淨。\n- **買盤急凍**：但如果融資大減代表的是買盤急凍呢？\n\n所以不能老是套公式，市場沒有公式，這是社會組比自然組高明的地方。\n\n## 去槓桿的怪邏輯\n例如很多電視節目說韓國、台灣、美國只是去槓桿，之後就好了。這邏輯很怪啊！一堆股票之前就是靠槓桿漲上去的，現在去槓桿，就表示漲不上去了啊，為什麼可以把因果關係誇誇其談大家還買單？\n",
            "sanctuary-finger-6.md": "# 資本支出有時不等於股價上漲\n\n## 多頭與空頭的本質\n- **多頭**：就是信心很夠，買股票會賺，就一直有人拿賺的錢再投入，型態上自然是高過高，低不破低。\n- **空頭**：是怎麼買怎麼賠，大家不想再買股票了，缺乏買盤，型態上就是高不過高，低破低。\n\n## 資本支出的效應\n最近有人說很多大廠資本支出增加，股票反而大跌，其實就是流通的錢就這麼多，把錢拿去擴廠，但賺到的錢很稀少，與花出去的錢不成比例。這樣哪來多餘的錢買股票？自然是賣股籌錢。\n",
            "sanctuary-finger-7.md": "# 承受的精神力\n\n忍受虧損的精神力很重要，往往是成敗關鍵。\n\n亞當理論要我們縮小部位，以遊戲的心態，數字是數字，不要轉化為實際盈虧（巨人傑也有提過）。有幾個作法：\n\n1. **零股交易**：改用零股交易，維持參與感，卻不會因大跌亂進出。\n2. **永遠保留很小的部位**：不會因怕錯失亂追漲，又因下跌承受不住亂砍而反覆過度交易。\n3. **芭樂單預掛戰法**：故意掛離開很遠的點位，如傅大士隨緣成交。這在打轉折單時很有用，而且常常芭樂單會成交，成本超低，賠率高，停損很好設。\n",
            "sanctuary-finger-8.md": "# 攤平搶轉折、對不對?!\n\n亞當理論第一條說，不要攤平虧錢部位。這是完全不抓轉折來說，因為如果一直摸底，勝率低到本都可能賠光。\n\n但因為股票有其價值，與期貨純投機稍有不同，會有一點投資成分，所以愈跌如果想抄底抓轉折，有幾個竅門：\n\n(1) **用不影響心情的部位去搶**：例如零股戰法，不痛不癢，反而容易成功。\n(2) **每次往下掛單的區間愈來愈大**：比如本來跌 5% 買，再來變成跌 10% 再買，再來變成跌 20% 才買。\n(3) **嚴設停損**：左側交易如果部位大，要知道勝率低，用停損小賠去換以後抄底成功的賠率。\n",
            "sanctuary-finger-9.md": "# 亞當理論趨勢解釋\n\n我讀亞當理論，他說要上正在發動的車，但這有個問題，就算是下跌的空頭趨勢，也常伴隨強烈的反彈，有可能當天空在最低點，補在最高點而賠錢，所以有幾個可以探討之處：\n\n(1) **要依據週期**：例如日線級別走多，日內也可能重挫；日線級別走空，日內也可能暴漲。所以先看自己交易的是哪個週期，才能決定現在的股價行為是什麼。\n\n(2) **觀察週期與慣性**：亞當理論說趨勢是不斷重複的事，並沒有說上漲就不會拉回，下跌就不會反彈，要看這個重複行為是依據哪個週期而說？又說我們要觀察的是市場當下是如何，而非應該如何，所以我認為第一步是決定週期，第二是描述市場在這個週期下現在的運動，第三步是觀察市場是否有重複出現的價格行為，如果有，我們假設會持續，直到被外力改變。\n\n(3) **防線判斷與優化**：承2，當市場持續出現高過高，低不破低，就是多頭（道氏多方防線）；反過來出現低破低，高不過高，就是空頭（道氏空方防線）。亞當理論要我們做的就是假設多空都會持續，在多頭時動作就是買，但可以等拉回買；空頭時就是空，但可以等反彈空，而不是多頭時賣，空頭時買，只是買賣點位置可以優化。\n\n(4) **假設趨勢會持續**：多頭賺不到錢的人，常常是因為自己莫名其妙預設壓力而太早賣，就算買低點也賠錢；空頭則是莫名其妙假設反彈變反轉而出掉空單。\n\n(5) **抓轉折不要當主流**：東山在《股市戰略與絕學》P405，認為 5, 10 日線都下彎時，轉空機率 30% 可以開始放空；還有提到有些強勢股在轉空時，都會再拉一段超可怕的漲幅，我管它叫做 over over heat（過熱中的過熱），但這都是指標或抓轉折，不是亞當理論的正辦。\n\n(6) **流派分析參考即可**：東山提到空頭初期要空弱勢股，空頭末期則要空逆勢上漲股（因為最後會被大盤帶下去）；多頭時初期要買強勢股，多頭末期要買落後補漲股。這些有點早期亞當理論順勢派，後期轉折派的味道，但我建議還是以亞當理論為主，因為你怎麼知道是多頭初期或末期？有太多猜測與主觀判斷的成分。\n\n(7) **亞當理論之優化**：不論是抓上漲拉回買點（或下跌反彈空點），都建議可以用賴盛唐的「過熱 ➡️ P(樞紐) ➡️ K(關鍵)」去應對。簡單來說，多頭打樞紐低，多方道氏防線附近；空頭打樞紐高，空方道氏防線附近，兼顧勝率賠率。\n\n(8) **多空看法並不重要**：比如空頭時，也會出現反轉訊號，短暫的高過高低不破低，然後又回到空頭繼續破底；多頭中間也會有很多大幅修正。所以要有彈性，因為多空看法實際上不是那麼重要，現在「是」什麼比較重要。由於股票是以日為主，就看日 K，但買點可能以當天的日內為主，就以當天日內為主。\n\n(9) **精神力輔助戰法**：芭樂價傅大士隨緣成交法，或零股法，都大大增加精神力，彌補多空看錯的風險。\n",
            "sanctuary-finger-10.md": "# 期貨刷單1分k\n\n期貨 1 分 K 刷單的實戰戰術可以歸納為以下幾個面向：\n\n(1) **芭樂價戰法**：掛在可能發生轉折處，但距離要很遠。\n\n(2) **順勢戰法（停損）**：掛離市價不遠，如果期待的行情沒有在買入後迅速發生，則要儘快平倉（符合亞當理論：表示行情當下沒發生）。\n\n(3) **順勢戰法（反覆刷）**：掛離市價不遠，如果獲利則反覆刷。例如做多，上漲一段就賣，小拉回馬上又買，如果趨勢正確，可以一直反覆獲利；放空也是同理，但必須隨時留意過熱訊號。\n\n(4) **適用盤勢**：芭樂價戰法比較適合用來抓轉折或應對震盪盤。\n\n(5) **樞紐抄底**：抓轉折也可以用「過熱 ➡️ P(樞紐) ➡️ K(關鍵k)」的架構去打，但一定要設好停損。經驗上，這套方法用在 1 分 K 撈底非常好用。\n",
            "sanctuary-finger-11.md": "# 有部位就無法客觀\n\n(1) **多空幻象與週期**：賴盛堂在《多空本是幻象》中提到，多空都是事後論、馬後炮。其實做多有賺到錢都是多頭，放空有賺到錢就是空頭，另外這也要參照你的交易週期。詳細影片可以參考：\n[賴盛堂：多空本是幻象](https://www.youtube.com/watch?v=IcC-uMdC7gs&t=86s)\n\n(2) **慣性價格行為**：賴盛堂用道氏運動與道氏防線客觀地定義多空，配合亞當理論，只要重複出現某種價格行為，就是現在的運動慣性。例如道氏多方防線一直向上就是多頭，但進出點可以參考「過熱 ➡️ 樞紐 ➡️ 關鍵K」。\n\n(3) **價格慣性與觀音仁**：亞當理論最直觀，例如低破低、高不過高，雖然反彈強勁，但重複出現的行為就是「跌 ➡️ 彈 ➡️ 跌 ➡️ 彈」慢慢向下，我們就根據這樣的行為操作。比如觀察到最近夜盤都開盤拉高，到了晚上砸盤，就可以利用這種重複行為擬定策略。這就是四大菩薩操作要義中，「觀音仁」所代表的觀察當下價格行為。\n",
            "sanctuary-finger-12.md": "# 先假設自己是錯的\n\n(1) **幽靈的第一條規則**：先假設自己是錯的，然後讓市場證明自己是對的。散戶通常相反：先假設自己可以贏多少錢，然後讓市場來證明自己是錯的，最終被迫狼狽出場。\n\n(2) **未證實即撤退**：這條規則本質上就是「若進場後市場一段時間沒有證明你是對的，就要趕快平倉甚至考慮反手」。比方說你做多，但 30 分鐘過去了市場並沒有大幅上漲，這時就應該平倉，因為市場隨後可能下跌或是正處於盤整。\n\n(3) **順勢加碼原則**：只有當市場依照你的預期方向行進、被市場證明你是對的時，才能繼續加碼。\n\n(4) **獲利出場時機**：幽靈的禮物認為，獲利時最後出場的方法是觀察成交量或價格型態的轉變。在我們的系統中，可以用「過熱與 P(樞紐) ➡️ K(關鍵K)」的轉變來取代。\n\n(5) **股期交易環境分治**：這在期貨上尤其適用。股票因為手續費與交易稅是期貨的好幾百倍，且價格跳動也沒那麼誇張，所以仍可以等待市場掃到停損再出場。期貨則是一段時間沒有依照預期就應果斷出場，而不會等到真的掃到停損才走。但股票如果加了槓桿，則必須以期貨的精神視之。\n\n(6) **賺賠比核心思維**：這也是賺賠比的概念，旨在縮小虧損、放大獲利。只是它更往前跨了一步：先假設自己勝率不高，優先想到最壞的情況，完全排除最壞的運氣，並讓市場來證明你對。這是非常核心且重要的概念。\n",
            "sanctuary-finger-13.md": "# 週期與多空\n\n(1) **討論多空前先談週期**：多空要看週期。例如日內一直跌，按照亞當理論要做空，這是日內週期；但從日線看，也是依據亞當理論，又是高過高、低不破低的走勢，日線級別反而要做多。不過，如果日內每天都走跌，反映久了最終也會改變日線級別的多空。\n\n(2) **股票用期貨的精神去設買賣點**：股票因為手續費貴、交易稅也貴，操作上應儘量以日線級別的趨勢為主，但買賣點卻可以利用當天日內期貨的做法，掛芭樂價而非市價去追，因為日線沒問題不代表可以不顧買入成本。\n\n(3) **精神力與日內買賣點**：日內股票好的買點，其主要優點是能使交易者的精神力不至於崩潰，不會因為一個微幅的拉回就急著想要賣出。\n\n(4) **勿被迫交易**：我一直強調精神力，只有精神力不崩潰才有辦法賺到錢。這點亞當理論也有提到，用不影響生活的資金逐步放大，抱著好玩、遊戲的心態，而非被迫交易。例如盤中看到喜歡的股票急拉，常被迫追在高價，但日線上其實根本尚未突破。因此我常強調零股與傅大士芭樂價戰法。\n\n(5) **注意速度**：日內觀察股票的走勢，需要特別注意價格跳動與趨勢行進的速度。\n\n(6) **亞當理論核心**：根據你的週期，先觀察股價行為「現在是什麼」，而非「應該要怎樣」，避免主觀武斷。再看有沒有重複出現的價格行為可以利用？這個重複的行為是否已經改變？如果改變了又該如何應對？\n"
        };

        // Page Initialization
        window.addEventListener('load', () => {
            loadCatalogData();
        });

        function loadCatalogData() {
            // Render default list immediately
            renderCatalog(fingerArticles);

            // Fetch external JSON for updates with multi-path fallback
            fetch('sanctuary-finger.json')
                .then(res => res.ok ? res : fetch('./sanctuary-finger.json'))
                .then(res => res.ok ? res : fetch('/sanctuary-finger.json'))
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        fingerArticles = data;
                        renderCatalog(fingerArticles);
                    }
                    handleRouting();
                })
                .catch(err => {
                    console.warn("使用內建指月錄目錄資料:", err);
                    handleRouting();
                });
        }

        function handleRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            if (articleId) {
                loadArticle(articleId);
            } else {
                showCatalogView();
            }
        }

        function navigateToCatalog() {
            history.pushState(null, '', 'stock-finger.html?view=catalog');
            showCatalogView();
        }

        function navigateToArticle(id) {
            history.pushState(null, '', `stock-finger.html?id=${id}`);
            loadArticle(id);
        }

        function showCatalogView() {
            document.getElementById('detailView').classList.remove('active');
            document.getElementById('catalogView').classList.add('active');
            document.title = "股海指月錄 | 股海學習";
        }

        function showDetailView() {
            document.getElementById('catalogView').classList.remove('active');
            document.getElementById('detailView').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCatalog(articles) {
            const container = document.getElementById('itemListContainer');
            if (!container) return;
            container.innerHTML = '';

            articles.forEach(article => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => navigateToArticle(article.id);

                card.innerHTML = `
                    <div class="item-info">
                        <h3>${article.title}</h3>
                        <p class="item-desc">${article.description}</p>
                    </div>
                    <div class="item-date">${article.date}</div>
                `;
                container.appendChild(card);
            });
        }

        function loadArticle(articleId) {
            const articleObj = fingerArticles.find(a => a.id === articleId);
            if (!articleObj) {
                showCatalogView();
                return;
            }

            document.getElementById('activeTitle').textContent = articleObj.title;
            document.getElementById('activeDate').textContent = `發布日期：${articleObj.date}`;
            showDetailView();

            // Render built-in fallback content immediately (0ms instant display!)
            if (fallbackFingerMarkdownMap[articleObj.filename]) {
                renderArticleMarkdown(fallbackFingerMarkdownMap[articleObj.filename]);
            } else {
                document.getElementById('activeContent').innerHTML = "<p style='color: var(--text-secondary);'>文章內容載入中...</p>";
            }

            // Attempt fetching external file for any dynamic updates
            fetch(articleObj.filename)
                .then(res => res.ok ? res : fetch('./' + articleObj.filename))
                .then(res => res.ok ? res : fetch('/' + articleObj.filename))
                .then(res => res.ok ? res.text() : null)
                .then(markdownText => {
                    if (markdownText) {
                        renderArticleMarkdown(markdownText);
                    }
                })
                .catch(err => {
                    console.warn("使用內建備份文章快取");
                });
        }

                function renderArticleMarkdown(text) {
            const contentArea = document.getElementById('activeContent');
            contentArea.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = 'detail-content-area';

            let normalizedText = text;
            if (normalizedText.includes('\\n')) {
                normalizedText = normalizedText.replace(/\\n/g, '\n');
            }
            const lines = normalizedText.split('\n');
            let delay = 0;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();

                if (trimmed.startsWith('# ')) continue;

                if (trimmed === '') {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'detail-empty-line';
                    wrapper.appendChild(lineDiv);
                    continue;
                }

                if (trimmed.startsWith('#')) {
                    const levelMatch = trimmed.match(/^#+/);
                    if (levelMatch) {
                        const level = levelMatch[0].length;
                        const headingText = trimmed.replace(/^#+\s+/, '');
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'detail-line';
                        lineDiv.style.fontWeight = '700';
                        lineDiv.style.color = 'var(--text-primary)';
                        lineDiv.style.marginTop = level === 2 ? '36px' : level === 3 ? '28px' : '22px';
                        lineDiv.style.marginBottom = '10px';

                        let formattedHeading = headingText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        lineDiv.innerHTML = formattedHeading;

                        if (level === 2) {
                            lineDiv.style.fontSize = '1.5rem';
                            lineDiv.style.borderBottom = '1px solid var(--border-color)';
                            lineDiv.style.paddingBottom = '6px';
                        } else if (level === 3) {
                            lineDiv.style.fontSize = '1.3rem';
                            lineDiv.style.color = 'var(--accent-gold)';
                        } else {
                            lineDiv.style.fontSize = '1.15rem';
                        }

                        lineDiv.style.animationDelay = `${delay}s`;
                        delay += 0.03;
                        wrapper.appendChild(lineDiv);
                        continue;
                    }
                }

                if (trimmed === '---') {
                    const hr = document.createElement('hr');
                    hr.style.border = 'none';
                    hr.style.borderTop = '1px solid var(--border-color)';
                    hr.style.margin = '30px 0';
                    wrapper.appendChild(hr);
                    continue;
                }

                if (trimmed.startsWith('![')) {
                    const match = trimmed.match(/^!\[(.*?)\]\((.*?)\)$/);
                    if (match) {
                        const img = document.createElement('img');
                        img.src = match[2];
                        img.alt = match[1];
                        img.style.maxWidth = '100%';
                        img.style.display = 'block';
                        img.style.margin = '30px auto 10px auto';
                        img.style.borderRadius = '12px';
                        img.style.boxShadow = 'var(--shadow-sm)';
                        img.style.opacity = '0';
                        img.style.transform = 'translateY(15px)';
                        img.style.animation = 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                        img.style.animationDelay = `${delay}s`;
                        delay += 0.03;
                        wrapper.appendChild(img);
                        continue;
                    }
                }

                let isQuote = false;
                let cleanLine = trimmed;
                if (trimmed.startsWith('>')) {
                    isQuote = true;
                    cleanLine = trimmed.replace(/^>\s*/, '').trim();
                }

                if (cleanLine.startsWith('[!')) {
                    const alertType = cleanLine.match(/\[!(.*?)\]/);
                    if (alertType) {
                        const typeText = alertType[1] === 'NOTE' ? '注意' : alertType[1] === 'TIP' ? '提示' : alertType[1] === 'IMPORTANT' ? '重要' : alertType[1] === 'DANGER' ? '警示' : alertType[1];
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'detail-line';
                        lineDiv.style.fontWeight = 'bold';
                        lineDiv.style.color = 'var(--accent-gold)';
                        lineDiv.style.marginTop = '15px';
                        lineDiv.innerHTML = `<i class="bi bi-info-circle-fill"></i> ${typeText}：`;
                        lineDiv.style.animationDelay = `${delay}s`;
                        delay += 0.03;
                        wrapper.appendChild(lineDiv);
                        continue;
                    }
                }

                const lineDiv = document.createElement('div');
                lineDiv.className = 'detail-line';

                let displayText = cleanLine;
                let listIndent = 0;

                if (cleanLine.startsWith('- ')) {
                    displayText = '• ' + cleanLine.substring(2);
                    listIndent = 20;
                } else if (cleanLine.match(/^\d+\.\s/)) {
                    const match = cleanLine.match(/^(\d+\.\s)(.*)/);
                    if (match) {
                        displayText = match[1] + match[2];
                        listIndent = 20;
                    }
                } else if (cleanLine.match(/^\*\s/)) {
                    displayText = '• ' + cleanLine.substring(2);
                    listIndent = 20;
                }

                const leadingSpaces = line.match(/^(\s+)/);
                if (leadingSpaces) {
                    listIndent += leadingSpaces[1].length * 6;
                }

                if (listIndent > 0) {
                    lineDiv.style.paddingLeft = `${listIndent}px`;
                }

                let formattedText = displayText
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                lineDiv.innerHTML = formattedText;

                if (isQuote) {
                    lineDiv.style.borderLeft = '3px solid var(--accent-gold)';
                    lineDiv.style.paddingLeft = '15px';
                    lineDiv.style.color = 'var(--text-secondary)';
                    lineDiv.style.fontStyle = 'italic';
                }

                lineDiv.style.animationDelay = `${delay}s`;
                delay += 0.03;
                wrapper.appendChild(lineDiv);
            }

            contentArea.appendChild(wrapper);
            document.title = `${document.getElementById('activeTitle').textContent} | 股海指月錄`;
        }
    </script>
</body>
</html>
