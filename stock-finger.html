<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股海指月錄 | 股海學習</title>
    <meta name="description" content="古藏寶的股海學習專欄 - 股海指月錄：觀照心性與股海實相的哲學心法。">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* ==========================================================================
           DESIGN SYSTEM & THEME
           ========================================================================== */
        :root {
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', 'Noto Sans TC', sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --border-radius-sm: 8px;
            --border-radius-md: 16px;
        }

        /* Light Theme */
        body.light-theme {
            --bg-primary: #FAF8F5;
            --bg-secondary: #F3ECE3;
            --bg-card: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --accent-gold: #855B00;
            --accent-gold-hover: #664500;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        /* Dark Theme */
        body.dark-theme {
            --bg-primary: #0A0E17;
            --bg-secondary: #0F1524;
            --bg-card: rgba(22, 30, 49, 0.6);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --accent-gold: #D4AF37;
            --accent-gold-hover: #F3C63F;
            --border-color: rgba(255, 255, 255, 0.07);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            transition: background-color 0.5s ease, color 0.5s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            flex-grow: 1;
        }

        a {
            color: var(--accent-gold);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        a:hover {
            color: var(--accent-gold-hover);
        }

        header {
            padding: 30px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 50px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo span {
            color: var(--accent-gold);
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .theme-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: rotate(15deg);
        }

        .footer {
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            margin-top: 80px;
            background-color: var(--bg-secondary);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* SPA Views */
        .view-section {
            display: none;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .view-section.active {
            display: block;
        }

        /* Catalog View Styling */
        .catalog-title-wrapper {
            text-align: center;
            margin-bottom: 50px;
        }

        .catalog-tag {
            font-family: var(--font-heading);
            font-style: italic;
            color: var(--accent-gold);
            font-size: 1.1rem;
            margin-bottom: 8px;
            display: block;
        }

        .catalog-title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .catalog-divider {
            width: 60px;
            height: 2px;
            background-color: var(--accent-gold);
            margin: 15px auto 0 auto;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .item-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 30px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
            box-shadow: var(--shadow-lg);
        }

        .item-info h3 {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .item-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .item-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Detail View Styling */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            margin-bottom: 30px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: var(--border-radius-sm);
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .back-btn:hover {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .detail-header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
        }

        .detail-title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .detail-content-area {
            font-family: var(--font-body);
            font-size: 1.1rem;
            line-height: 2.0;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            white-space: pre-wrap;
            text-align: left;
            display: inline-block;
            width: 100%;
        }

        .detail-line {
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInLine 0.5s ease forwards;
        }

        .detail-empty-line {
            height: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInLine {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="dark-theme">

    <!-- Navigation Header -->
    <header>
        <div class="container header-content">
            <a href="stock-learning.html" class="logo">
                <i class="bi bi-arrow-left-short" style="font-size: 1.5rem; vertical-align: middle;"></i>
                <span>古</span>藏寶 ‧ 股海指月錄
            </a>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button class="theme-btn" id="themeBtn" title="切換深/淺色模式" aria-label="Toggle Theme">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        
        <!-- View 1: Directory Catalog -->
        <section id="catalogView" class="view-section active">
            <div class="catalog-title-wrapper">
                <span class="catalog-tag">Stock Learning</span>
                <h1 class="catalog-title"><i class="bi bi-moon-stars-fill" style="color: var(--accent-gold); font-size: 1.8rem;"></i> 股海指月錄</h1>
                <div class="catalog-divider"></div>
                <p style="color: var(--text-secondary); margin-top: 15px; font-size: 0.95rem;">
                    指月非月，借技術招式以見市場實相。無明起處，即是修煉道場。
                </p>
            </div>

            <div class="item-list" id="itemListContainer">
                <!-- Articles list will be populated dynamically -->
            </div>
        </section>

        <!-- View 2: Article Detail Reader -->
        <section id="detailView" class="view-section">
            <a href="#" class="back-btn" onclick="navigateToCatalog(); return false;">
                <i class="bi bi-arrow-left-short" style="font-size: 1.4rem;"></i> 返回指月錄目錄
            </a>
            
            <article class="detail-header">
                <h1 id="activeTitle" class="detail-title">文章載入中...</h1>
                <p id="activeDate" style="color: var(--text-muted); font-size: 0.9rem;"></p>
            </article>

            <div id="activeContent">
                <!-- Parsed markdown lines rendered dynamically -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 古藏寶 (Dr. Chen) 股海學習專欄 ‧ 股海指月錄. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // --- Theme Switcher ---
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = themeBtn.querySelector('i');
        
        const savedTheme = localStorage.getItem('portfolio-theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.replace('dark-theme', 'light-theme');
            themeIcon.className = 'bi bi-sun-fill';
        }

        themeBtn.addEventListener('click', () => {
            if (document.body.classList.contains('dark-theme')) {
                document.body.classList.replace('dark-theme', 'light-theme');
                themeIcon.className = 'bi bi-sun-fill';
                localStorage.setItem('portfolio-theme', 'light');
            } else {
                document.body.classList.replace('light-theme', 'dark-theme');
                themeIcon.className = 'bi bi-moon-stars-fill';
                localStorage.setItem('portfolio-theme', 'dark');
            }
        });

        // --- Articles Data ---
        let fingerArticles = [
            {
                "id": "four-bodhisattvas",
                "title": "總綱：四大菩薩操作要義",
                "filename": "sanctuary-finger.md",
                "date": "2026-07-20",
                "description": "投機正法系統性歸納四大菩薩操作法門，重塑交易者內在心法：智（文殊）、仁（觀音）、靜（地藏）、勇（普賢）..."
            }
        ];

        // Page Initialization
        window.addEventListener('load', () => {
            loadCatalogData();
        });

        function loadCatalogData() {
            // Render default list immediately
            renderCatalog(fingerArticles);

            // Fetch external JSON for updates with multi-path fallback
            fetch('sanctuary-finger.json')
                .then(res => res.ok ? res : fetch('./sanctuary-finger.json'))
                .then(res => res.ok ? res : fetch('/sanctuary-finger.json'))
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        fingerArticles = data;
                        renderCatalog(fingerArticles);
                    }
                    handleRouting();
                })
                .catch(err => {
                    console.warn("使用內建指月錄目錄資料:", err);
                    handleRouting();
                });
        }

        function handleRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            if (articleId) {
                loadArticle(articleId);
            } else {
                showCatalogView();
            }
        }

        function navigateToCatalog() {
            history.pushState(null, '', 'stock-finger.html');
            showCatalogView();
        }

        function navigateToArticle(id) {
            history.pushState(null, '', `stock-finger.html?id=${id}`);
            loadArticle(id);
        }

        function showCatalogView() {
            document.getElementById('detailView').classList.remove('active');
            document.getElementById('catalogView').classList.add('active');
            document.title = "股海指月錄 | 股海學習";
        }

        function showDetailView() {
            document.getElementById('catalogView').classList.remove('active');
            document.getElementById('detailView').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCatalog(articles) {
            const container = document.getElementById('itemListContainer');
            container.innerHTML = '';

            articles.forEach(article => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => navigateToArticle(article.id);

                card.innerHTML = `
                    <div class="item-info">
                        <h3>${article.title}</h3>
                        <p class="item-desc">${article.description}</p>
                    </div>
                    <div class="item-date">${article.date}</div>
                `;
                container.appendChild(card);
            });
        }

        function loadArticle(articleId) {
            const articleObj = fingerArticles.find(a => a.id === articleId);
            if (!articleObj) {
                showCatalogView();
                return;
            }

            document.getElementById('activeTitle').textContent = articleObj.title;
            document.getElementById('activeDate').textContent = `發布日期：${articleObj.date}`;
            document.getElementById('activeContent').innerHTML = "<p style='color: var(--text-secondary);'>文章內容載入中...</p>";
            showDetailView();

            fetch(articleObj.filename)
                .then(res => res.ok ? res : fetch('./' + articleObj.filename))
                .then(res => res.ok ? res : fetch('/' + articleObj.filename))
                .then(res => {
                    if (!res.ok) throw new Error("File not found");
                    return res.text();
                })
                .then(markdownText => {
                    renderArticleMarkdown(markdownText);
                })
                .catch(err => {
                    console.error("載入文章失敗:", err);
                    document.getElementById('activeContent').innerHTML = `<p style="color: var(--accent-gold);">載入文章內容失敗，請確認 '${articleObj.filename}' 檔案已上傳。</p>`;
                });
        }

        function renderArticleMarkdown(text) {
            const contentArea = document.getElementById('activeContent');
            contentArea.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = 'detail-content-area';

            const lines = text.split('\n');
            let delay = 0;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();

                if (trimmed.startsWith('# ')) continue;

                if (trimmed === '') {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'detail-empty-line';
                    wrapper.appendChild(lineDiv);
                    continue;
                }

                if (trimmed.startsWith('#')) {
                    const levelMatch = trimmed.match(/^#+/);
                    if (levelMatch) {
                        const level = levelMatch[0].length;
                        const headingText = trimmed.replace(/^#+\s+/, '');
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'detail-line';
                        lineDiv.style.fontWeight = '700';
                        lineDiv.style.color = 'var(--text-primary)';
                        lineDiv.style.marginTop = level === 2 ? '36px' : level === 3 ? '28px' : '22px';
                        lineDiv.style.marginBottom = '10px';

                        let formattedHeading = headingText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        lineDiv.innerHTML = formattedHeading;

                        if (level === 2) {
                            lineDiv.style.fontSize = '1.5rem';
                            lineDiv.style.borderBottom = '1px solid var(--border-color)';
                            lineDiv.style.paddingBottom = '6px';
                        } else if (level === 3) {
                            lineDiv.style.fontSize = '1.3rem';
                            lineDiv.style.color = 'var(--accent-gold)';
                        } else {
                            lineDiv.style.fontSize = '1.15rem';
                        }

                        lineDiv.style.animationDelay = `${delay}s`;
                        delay += 0.03;
                        wrapper.appendChild(lineDiv);
                        continue;
                    }
                }

                if (trimmed === '---') {
                    const hr = document.createElement('hr');
                    hr.style.border = 'none';
                    hr.style.borderTop = '1px solid var(--border-color)';
                    hr.style.margin = '30px 0';
                    wrapper.appendChild(hr);
                    continue;
                }

                if (trimmed.startsWith('![')) {
                    const match = trimmed.match(/^!\[(.*?)\]\((.*?)\)$/);
                    if (match) {
                        const img = document.createElement('img');
                        img.src = match[2];
                        img.alt = match[1];
                        img.style.maxWidth = '100%';
                        img.style.display = 'block';
                        img.style.margin = '30px auto 10px auto';
                        img.style.borderRadius = '12px';
                        img.style.boxShadow = 'var(--shadow-sm)';
                        img.style.opacity = '0';
                        img.style.transform = 'translateY(15px)';
                        img.style.animation = 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                        img.style.animationDelay = `${delay}s`;
                        delay += 0.03;
                        wrapper.appendChild(img);
                        continue;
                    }
                }

                let isQuote = false;
                let cleanLine = trimmed;
                if (trimmed.startsWith('>')) {
                    isQuote = true;
                    cleanLine = trimmed.replace(/^>\s*/, '').trim();
                }

                if (cleanLine.startsWith('[!')) {
                    const alertType = cleanLine.match(/\[!(.*?)\]/);
                    if (alertType) {
                        const typeText = alertType[1] === 'NOTE' ? '注意' : alertType[1] === 'TIP' ? '提示' : alertType[1] === 'IMPORTANT' ? '重要' : alertType[1] === 'DANGER' ? '警示' : alertType[1];
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'detail-line';
                        lineDiv.style.fontWeight = 'bold';
                        lineDiv.style.color = 'var(--accent-gold)';
                        lineDiv.style.marginTop = '15px';
                        lineDiv.innerHTML = `<i class="bi bi-info-circle-fill"></i> ${typeText}：`;
                        lineDiv.style.animationDelay = `${delay}s`;
                        delay += 0.03;
                        wrapper.appendChild(lineDiv);
                        continue;
                    }
                }

                const lineDiv = document.createElement('div');
                lineDiv.className = 'detail-line';

                let displayText = cleanLine;
                let listIndent = 0;

                if (cleanLine.startsWith('- ')) {
                    displayText = '• ' + cleanLine.substring(2);
                    listIndent = 20;
                } else if (cleanLine.match(/^\d+\.\s/)) {
                    const match = cleanLine.match(/^(\d+\.\s)(.*)/);
                    if (match) {
                        displayText = match[1] + match[2];
                        listIndent = 20;
                    }
                } else if (cleanLine.match(/^\*\s/)) {
                    displayText = '• ' + cleanLine.substring(2);
                    listIndent = 20;
                }

                const leadingSpaces = line.match(/^(\s+)/);
                if (leadingSpaces) {
                    listIndent += leadingSpaces[1].length * 6;
                }

                if (listIndent > 0) {
                    lineDiv.style.paddingLeft = `${listIndent}px`;
                }

                let formattedText = displayText
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                lineDiv.innerHTML = formattedText;

                if (isQuote) {
                    lineDiv.style.borderLeft = '3px solid var(--accent-gold)';
                    lineDiv.style.paddingLeft = '15px';
                    lineDiv.style.color = 'var(--text-secondary)';
                    lineDiv.style.fontStyle = 'italic';
                }

                lineDiv.style.animationDelay = `${delay}s`;
                delay += 0.03;
                wrapper.appendChild(lineDiv);
            }

            contentArea.appendChild(wrapper);
            document.title = `${document.getElementById('activeTitle').textContent} | 股海指月錄`;
        }
    </script>
</body>
</html>
