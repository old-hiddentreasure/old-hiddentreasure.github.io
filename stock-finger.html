            "sanctuary-finger.md": "# \u7e3d\u7db1\uff1a\u56db\u5927\u83e9\u85a9\u64cd\u4f5c\u8981\u7fa9\n\n\u5728\u80a1\u7968\u5e02\u5834\u7684\u9a5a\u6fe4\u99ed\u6d6a\u4e2d\uff0c\u4ea4\u6613\u8005\u5f80\u5f80\u5bb9\u6613\u8ff7\u5931\u5728\u7121\u7aae\u7121\u76e1\u7684\u6307\u6a19\u3001\u7c4c\u78bc\u8207\u5e02\u5834\u566a\u97f3\u4e2d\u3002\u70ba\u4e86\u91cd\u5851\u4ea4\u6613\u8005\u7684\u5167\u5728\u5fc3\u6cd5\uff0c\u5c07\u6295\u6a5f\u6b63\u6cd5\u7cfb\u7d71\u6027\u5730\u6b78\u7d0d\u70ba**\u300c\u56db\u5927\u83e9\u85a9\u64cd\u4f5c\u6cd5\u9580\u300d**\uff1a\n\n1. **\u667a\uff08\u667a\u6587\u6b8a\uff09**\uff1a\u4ee3\u8868\u300c\u9810\u671f\u4e16\u754c\u7684\u69cb\u5efa\u8207\u50f9\u683c\u6839\u672c\u300d\uff08\u5c6c\u65bc\u5206\u6790\uff09\u3002\n2. **\u4ec1\uff08\u60b2\u89c0\u97f3\uff09**\uff1a\u4ee3\u8868\u300c\u771f\u5be6\u4e16\u754c\u7684\u5c0d\u9f4a\u8207\u9ad4\u611f\u8b58\u5225\u300d\uff08\u5c6c\u65bc\u63a5\u53d7\u8207\u4fee\u6b63\uff09\u3002\n3. **\u975c\uff08\u975c\u5730\u85cf\uff09**\uff1a\u4ee3\u8868\u300c\u4e0d\u52d5\u5982\u5c71\u7684\u90e8\u4f4d\u7ba1\u7406\u8207\u98a8\u96aa\u63a7\u5236\u300d\uff08\u5c6c\u65bc\u7b49\u5f85\u8207\u5b88\u6210\uff09\u3002\n4. **\u52c7\uff08\u884c\u666e\u8ce2\uff09**\uff1a\u4ee3\u8868\u300c\u95dc\u9375\u50f9\u4f4d\u7684\u6975\u81f4\u51fa\u624b\u8207\u57f7\u884c\u300d\uff08\u5c6c\u65bc\u51fa\u624b\u8207\u57f7\u884c\uff09\u3002\n\n\u4ee5\u4e0b\u70ba\u56db\u5927\u83e9\u85a9\u7684\u64cd\u4f5c\u8981\u7fa9\uff0c\u662f\u5168\u66f8\u5fc3\u614b\u8207\u5be6\u6230\u64cd\u4f5c\u7684\u7e3d\u7db1\u9818\u3002\n\n---\n\n## \u667a\uff08\u667a\u6587\u6b8a\uff09\u2014\u2014 \u9810\u671f\u4e16\u754c\u7684\u69cb\u5efa\u8207\u50f9\u683c\u6839\u672c\n\n> **\u300c\u50f9\u683c\u624d\u662f\u6839\u672c\uff0c\u6d1e\u6089\u5e02\u5834\u610f\u5fd7\u6240\u9a45\u52d5\u7684\u52e2\u8207\u5e02\u3002\u300d**\n\n\u300c\u667a\u6587\u6b8a\u300d\u6cd5\u9580\u5c6c\u65bc**\u5206\u6790\u968e\u6bb5**\u3002\u5728\u958b\u76e4\u524d\uff0c\u4ea4\u6613\u8005\u900f\u904e\u5ba2\u89c0\u6578\u64da\u5728\u8166\u6d77\u4e2d\u52fe\u52d2\u51fa\u4e00\u500b\u9810\u671f\u7684**\u300c\u7406\u60f3\u4e16\u754c\u300d**\uff0c\u4e26\u5728\u9032\u5165\u771f\u5be6\u6230\u5834\u524d\u5b8c\u6210\u5fc3\u614b\u7684**\u300c\u8f49\u5ff5\u300d**\u3002\n\n* **\u50f9\u683c\u6839\u672c\u8207\u610f\u5fd7\u9a45\u52d5**\uff1a\n  * **\u50f9\u683c\u624d\u662f\u6839\u672c**\uff1a\u62cb\u68c4\u6240\u6709\u5c0d\u5916\u5728\u6307\u6a19\u7684\u76f2\u76ee\u4fe1\u4ef0\uff0c\u4e00\u5207\u4ee5\u50f9\u683c\u884c\u70ba\uff08Price Action\uff09\u5b9a\u9328\u3002\n  * **\u610f\u5fd7\u3001\u52e2\u3001\u5e02\uff08\u5e02\u5834 82 \u6cd5\u5247\uff09**\uff1a\u6d1e\u6089\u5e02\u5834\u5e95\u5c64\u7531\u6838\u5fc3\u610f\u5fd7\u9a45\u52d5\u300c\u52e2\u300d\uff0c\u9032\u800c\u5f62\u6210\u300c\u5e02\u300d\u7684\u50b3\u5c0e\u93c8\u3002\u5206\u6790\u4e26\u9396\u5b9a\u53ef\u80fd\u9a45\u52d5\u884c\u60c5\u3001\u50c5\u5360 2 \u6210\u7684\u95dc\u9375\u65cf\u7fa4\u3002\n* **\u9810\u671f\u8207\u8a8d\u77e5\u5c40\u9650**\uff1a\n  * **\u8a8d\u77e5\u6c38\u9060\u4e0d\u5b8c\u6574**\uff1a\u627f\u8a8d\u4eba\u985e\u5c0d\u5e02\u5834\u7684\u7406\u89e3\u5fc5\u7136\u5b58\u5728\u7f3a\u9677\u8207\u76f2\u5340\uff0c\u653e\u4e0b\u300c\u5206\u6790\u842c\u80fd\u300d\u7684\u57f7\u5ff5\u3002\n  * **\u540c\u6a23\u7dda\u578b\u4e0d\u540c\u547d\u904b**\uff1a\u7834\u9664\u5716\u8868\u56e0\u679c\u8ad6\u3002\u4e00\u6a21\u4e00\u6a23\u7684\u6280\u8853\u7dda\u578b\uff0c\u80cc\u5f8c\u53ef\u80fd\u8d70\u5411\u5b8c\u5168\u76f8\u53cd\u7684\u547d\u904b\uff0c\u5fc5\u9808\u4ee5\u6a5f\u7387\u601d\u7dad\u5f85\u4e4b\u3002\n  * **\u6a5f\u7387\u512a\u52e2\uff08\u98a8\u96aa\u5831\u916c\u4e0d\u5c0d\u7b49\u512a\u52e2\uff09**\uff1a\u4e0d\u5f37\u6c42\u9ad8\u52dd\u7387\uff0c\u800c\u662f\u5c0b\u627e\u98a8\u96aa\u6975\u5c0f\u800c\u6f5b\u5728\u5229\u6f64\u6975\u5927\u7684\u4e0d\u5c0d\u7b49\u6a5f\u7387\u6a5f\u6703\u3002\n* **\u7b56\u7565\u5b9a\u9328\u8207\u601d\u7dad\u91cd\u5851**\uff1a\n  * **\u96d9\u7387\u601d\u8003**\uff1a\u96a8\u6642\u6b0a\u8861\u300c\u52dd\u7387\u300d\u8207\u300c\u8cfa\u8ce0\u6bd4\u300d\uff0c\u4ee5\u671f\u671b\u503c\u70ba\u6838\u5fc3\u3002\n  * **\u4e2d\u6027\u601d\u8003\u8207\u7070\u968e\u539f\u5247**\uff1a\u5e02\u5834\u4e0d\u662f\u975e\u9ed1\u5373\u767d\uff0c\u5229\u591a\u8207\u5229\u7a7a\u4e4b\u9593\u5b58\u5728\u5927\u7247\u52d5\u614b\u6f14\u8b8a\u7684\u7070\u8272\u5730\u5e36\u3002\u4fdd\u6301\u4e2d\u6027\uff0c\u4e0d\u5e36\u4e3b\u89c0\u504f\u898b\u3002\n  * **\u4e8b\u4ef6\u5169\u9762\u6027\u539f\u5247**\uff1a\u4efb\u4f55\u6d88\u606f\u6216\u4e8b\u4ef6\u90fd\u6709\u5176\u96d9\u5203\u528d\u6027\u8cea\uff0c\u4e0d\u4ee5\u55ae\u4e00\u5229\u591a\u6216\u5229\u7a7a\u9032\u884c\u7dda\u6027\u89e3\u8b80\u3002\n  * **\u4f30\u503c\u91cd\u8abf\u8207\u7bc0\u594f\u8f49\u63db**\uff1a\u7406\u89e3\u80a1\u50f9\u66b4\u6f32\u672c\u8cea\u4e0a\u662f\u5e02\u5834\u9810\u671f\u5171\u8b58\u7684\u96c6\u9ad4\u8f49\u79fb\uff08Re-rating\uff09\uff0c\u4e26\u96a8\u6642\u7559\u610f\u5e02\u5834\u7bc0\u594f\u7684\u52d5\u614b\u8f49\u63db\u3002\n  * **\u4ea4\u6613\u74b0\u5883\u5206\u6cbb**\uff1a\u660e\u78ba\u5340\u5206\u300c\u734e\u91d1\u9078\u80a1\uff08\u6ce2\u6bb5\u4ea4\u6613\uff09\u300d\u8207\u300c\u85aa\u6c34\u9078\u80a1\uff08\u7576\u6c96\u4ea4\u6613\uff09\u300d\u5728\u9078\u80a1\u908f\u8f2f\u8207\u505c\u640d\u8a2d\u8a08\u4e0a\u7684\u672c\u8cea\u65b7\u5c64\u3002\n\n---\n\n## \u4ec1\u8207\u975c\uff08\u60b2\u89c0\u97f3\u3001\u975c\u5730\u85cf\uff09\u2014\u2014 \u771f\u5be6\u4e16\u754c\u7684\u5c0d\u9f4a\u3001\u63a5\u53d7\u8207\u7b49\u5f85\n\n> **\u300c\u653e\u4e0b\u81ea\u6211\u57f7\u8457\uff0c\u4ee5\u771f\u5be6\u76e4\u9762\u88dc\u8db3\u9810\u671f\u4e16\u754c\u7684\u4e0d\u8db3\uff1b\u4e0d\u52d5\u5982\u5c71\uff0c\u5728\u7b49\u5f85\u4e2d\u5b88\u6210\u3002\u300d**\n\n\u300c\u4ec1\u89c0\u97f3\u300d\u8207\u300c\u975c\u5730\u85cf\u300d\u6cd5\u9580\u5c6c\u65bc**\u63a5\u53d7\u3001\u4fee\u6b63\u8207\u7b49\u5f85\u968e\u6bb5**\u3002\u7576\u958b\u76e4\u5f8c\uff0c\u4ea4\u6613\u8005\u5fc5\u9808\u653e\u4e0b\u81ea\u6211\u7684\u5805\u6301\uff0c\u5c07\u8166\u4e2d\u7684\u300c\u7406\u60f3\u4e16\u754c\u300d\u8207\u76e4\u9762\u7684\u300c\u771f\u5be6\u4e16\u754c\u300d\u53cd\u8986\u758a\u5408\u3001\u4fee\u6b63\uff0c\u4e26\u4fdd\u6301\u6975\u5927\u7684\u5b9a\u529b\u9032\u884c\u90e8\u4f4d\u63a7\u5236\u3002\n\n### \u4ec1\uff08\u60b2\u89c0\u97f3\uff09\uff1a\u89c0\u5bdf\u80a1\u50f9\u904b\u52d5\u50f9\u683c\u884c\u70ba(\u9053\u6c0f\u904b\u52d5\u3001\u9053\u6c0f\u9632\u7dda)\u8207\u771f\u5be6\u4e16\u754c\u7684\u5c0d\u9f4a\u3001\u9ad4\u611f\u4fee\u6b63\n\n* **\u5c0d\u9f4a\u4e16\u754c\u8207\u9ad4\u611f\u8b58\u5225**\uff1a\n  * **\u63db\u4f4d\u601d\u8003**\uff1a\u5f9e\u5be6\u969b\u76e4\u9762\u7684\u50f9\u683c\u884c\u70ba\u51fa\u767c\uff0c\u88dc\u8db3\u7406\u60f3\u9810\u671f\u7684\u4e0d\u8db3\uff0c\u5efa\u7acb\u654f\u92b3\u7684\u300c\u80a1\u7968\u9ad4\u611f\u8b58\u5225\u300d\u3002\n  * **\u63a5\u53d7\u4efb\u4f55\u53ef\u80fd\u6027**\uff1a\u9810\u6e2c\u6c38\u9060\u4e0d\u5b8c\u7f8e\u3002\u5fc5\u9808\u5efa\u7acb\u300c\u8cb7\u9032\u5f8c\u96a8\u6642\u53ef\u80fd\u5927\u8dcc\u300d\u7684\u9632\u5b88\u5fc3\u7406\u6846\u67b6\uff0c\u9019\u662f\u4fdd\u8b77\u4ea4\u6613\u5fc3\u7406\u7d20\u8cea\u7684\u95dc\u9375\u57fa\u77f3\u3002\n  * **\u65cf\u7fa4 82 \u6cd5\u5247**\uff1a\u7528\u5fc3\u611f\u53d7\u8207\u89c0\u5bdf\u76ee\u524d\u6b63\u5728\u76e4\u9762\u4e0a\u5be6\u969b\u9a45\u52d5\u884c\u60c5\u4e4b 2 \u6210\u80a1\u7968\u8207\u4e3b\u6d41\u65cf\u7fa4\uff0c\u653e\u68c4\u81ea\u6211\u7684\u4e3b\u89c0\u5805\u6301\u3002\n* **\u719f\u8b80\u4e9e\u7576\u7406\u8ad6\u3001\u770b\u7dda\u8fa6\u4e8b\u8207\u5f37\u5f31\u6bd4\u5c0d**\uff1a\n  * <span style=\"color: red;\">**\u4e9e\u7576\u7406\u8ad6\u8207\u512a\u5316**\uff1a\u5118\u91cf\u53ea\u505a\u8ce0\u7387\u9806\u52e2\u76e4\uff0c\u653e\u68c4\u52dd\u7387\u9707\u76ea\u76e4</span>\n    1. <span style=\"color: red;\">**\u5c0d\u5e02\u5834\u7121\u689d\u4ef6\u7684\u7121\u77e5\u8207\u81e3\u670d**\uff1a\u653e\u68c4\u4efb\u4f55\u770b\u6cd5\uff0c\u53ea\u770b\u50f9\u683c</span>\n    2. <span style=\"color: red;\">**\u53ea\u505a\u9806\u52e2\uff0c\u653e\u68c4\u6293\u8f49\u6298**\uff1a\u6703\u6f32\u7684\u80a1\u7968\u5230\u6708\u7403\u4e5f\u61c9\u8a72\u8cb7\uff0c\u6703\u8dcc\u7684\u80a1\u7968\u8dcc\u5230\u96f6\u4e5f\u8a72\u8ce3\uff0c\u4e0d\u8981\u81ea\u5df1\u6293\u8f49\u6298(\u5e02\u5834\u6703\u5e6b\u4f60\u6293)\uff0c\u907f\u958b\u9707\u76ea\uff0c\u4e9e\u7576\u7406\u8ad6\u4e0d\u731c\u982d\u6478\u5e95\uff0c\u6240\u4ee5\u53ea\u6709\u8f49\u6298\u6642\u6703\u932f(\u8a2d\u597d\u505c\u640d\u5c31\u53ef\uff0c\u5176\u4ed6\u90fd\u5c0d)</span>\n    3. <span style=\"color: red;\">**\u505a\u591a\u53ea\u505a\u5f37\u52e2\u80a1\uff0c\u505a\u7a7a\u53ea\u505a\u5f31\u52e2\u80a1**\uff1a\u4e0d\u53bb\u731c\u6e2c\u8f49\u6298\u9ede\uff0c\u4f46\u53ef\u4ee5\u8003\u616e\u96d9\u7387\uff0c\u6bd4\u65b9\u8aaa\u8da8\u52e2\u591a\u65b9\uff0c\u4ecd\u505a\u591a\uff0c\u4f46\u6ce8\u610f\u904e\u71b1\u53ef\u80fd\u53cd\u8f49\uff0c\u8abf\u6574\u90e8\u4f4d\uff0c\u8ce0\u7387\u82e5\u5dee\u5c31\u6e1b\u5009\uff0c\u7b49\u8ce0\u7387\u9ad8\u7684\u62c9\u56de\u8cb7\u9ede\uff0c\u8da8\u52e2\u7a7a\uff0c\u505a\u7a7a\uff0c\u4f46\u6ce8\u610f\u904e\u71b1\u53ef\u80fd\u53cd\u8f49\uff0c\u8abf\u6574\u90e8\u4f4d\uff0c\u8ce0\u7387\u82e5\u5dee\u5c31\u6e1b\u5009\uff0c\u7b49\u8ce0\u7387\u9ad8\u7684\u4e0a\u6f32\u7a7a\u9ede\uff0c\u4ee5\u4e9e\u7576\u7406\u8ad6\u6c7a\u5b9a\u591a\u7a7a\u8da8\u52e2\uff0c\u4e0d\u6293\u8f49\u6298\uff0c\u907f\u958b\u9707\u76ea\uff0c\u96d9\u7387\u512a\u5316</span>\n  * **\u770b\u7dda\u8fa6\u4e8b**\uff1a\u4f9d\u64da\u5171\u8b58\u8207\u7d50\u69cb\u4e3b\u7fa9\u9032\u884c\u50f9\u683c\u8b8a\u52d5\u8207\u50f9\u683c\u884c\u70ba\u7684\u89c0\u5bdf\u3002\u91dd\u5c0d\u6ce2\u52d5\u3001\u9806\u52e2\u3001\u76e4\u6574\u3001\u5927\u9707\u76ea\u7b49\u4e0d\u540c\u5e02\u5834\u72c0\u614b\uff0c\u63a1\u7528\u622a\u7136\u4e0d\u540c\u7684\u61c9\u5c0d\u7b56\u7565\uff1a\n    1. **\u9053\u6c0f\u904b\u52d5\u770b\u8da8\u52e2**\uff1a\u4f9d\u7167\u9053\u6c0f\u904b\u52d5\u3001\u9632\u7dda\u3001\u53cd\u8f49\u578b\u614b\u7b49\u8fa8\u8a8d\u591a\u7a7a\u904b\u52d5\u8da8\u52e2\uff08\u904b\u52d5\u5169\u5b57\u5f88\u91cd\u8981\uff09\u6216\u662f\u76e4\u6574\uff0c\u591a\u7a7a\u78ba\u7acb\u6253\u9806\u52e2\u8ce0\u7387\u76e4\uff0c\u76e4\u6574\u6253\u9006\u52e2\u52dd\u7387\u9ad8\u51fa\u4f4e\u9032\u3002\n    2. **\u904e\u71b1\u3001\u6a1e\u7d10\u8f49\u6298\u8207\u95dc\u9375k**\uff1a\u8fa8\u8b58\u904e\u71b1k \u27a1\ufe0f P(\u6a1e\u7d10)k(\u95dc\u9375k)[\u9032\u5165\u807d\u724c] \u27a1\ufe0f \u80e1\u724c\uff1b\u5927\u6a1e\u7d10\u624d\u662f\u8f49\u6298\uff08\u8f49\u6298\u662f\u91cd\u9ede\uff0c\u4f46\u5118\u91cf\u7565\u904e\u4e0d\u8981\u53bb\u6293\uff09\uff0c\u5c0f\u6a1e\u7d10\u8981\u61c2\u5f97\u7565\u904e\u3002\n    3. **\u4e0b\u55ae\u5f8c\u60f3\u8457\u53cd\u5411**\uff1a\u4e0b\u55ae\u5f8c\u5982\u679c\u4e0d\u5982\u9810\u671f\uff0c\u99ac\u4e0a\u53cd\u5411\u6216\u4ee5\u9707\u76ea\u76e4\u8655\u7406\u3002\n  * **\u7d50\u69cb\u5f37\u5f31\u6bd4\u5c0d**\uff1a\u96a8\u6642\u6bd4\u5c0d\u300c\u5927\u76e4\u3001\u71b1\u9580\u65cf\u7fa4\u3001\u81ea\u5df1\u6301\u80a1\u300d\u4e09\u8005\u4e4b\u9593\u7684\u7d50\u69cb\u5f37\u5f31\u3002\n  * **\u6642\u5e38\u7559\u610f\u8f49\u5f37\u65cf\u7fa4**\uff1a\n    1. **\u677f\u8569\u8b58\u5fe0\u81e3**\uff1a\u5927\u76e4\u4e0b\u8dcc\u6642\u624d\u662f\u89c0\u5bdf\u8207\u7be9\u9078\u5f37\u52e2\u80a1\u7684\u9ec3\u91d1\u7a97\u53e3\u3002\n    2. **\u7570\u5e38\u6ce2\u52d5\u8b58\u5225**\uff1a\u76e4\u4e2d\u6ce2\u52d5\u7a81\u7136\u8b8a\u5927\u3001\u6d17\u5237\u6108\u7528\u529b\u6108\u4ee3\u8868\u6709\u5927\u8cc7\u91d1\u904b\u4f5c\uff0c\u4f46\u65e5\u7dda\u537b\u80fd\u5b88\u4f4f\u95dc\u9375\u652f\u6490\u9ede\u4f4d\u3002\n  * **\u751f\u5b58\u7d05\u7dda**\uff1a\u80a1\u7968\u672a\u7ad9\u4e0a\u5e74\u7dda\uff08240 MA\uff09\u4e4b\u524d\uff0c\u539f\u5247\u4e0a\u5118\u91cf\u4e0d\u78b0\u3002\n* **\u9032\u653b\u6027\u90e8\u4f4d\u7ba1\u7406**\uff1a\n  * **\u6c70\u5f31\u7559\u5f37\u8207\u52a0\u78bc\u734e\u52f5**\uff1a\u6301\u80a1\u5fc5\u9808\u52d5\u614b\u8abf\u6574\uff0c\u5c07\u8cc7\u91d1\u5f9e\u5f31\u52e2\u3001\u8ce0\u9322\u7684\u80a1\u7968\u4e2d\u64a4\u51fa\uff0c\u8f49\u800c\u300c\u52a0\u78bc\u734e\u52f5\u300d\u5f37\u52e2\u4e14\u8cfa\u9322\u7684\u80a1\u7968\u3002\u9019\u4e0d\u50c5\u662f\u9632\u5b88\uff0c\u66f4\u662f\u5229\u7528\u69d3\u687f\u9032\u884c\u9632\u5b88\u53cd\u64ca\u7684\u4e3b\u52d5\u9032\u653b\u3002\n\n### \u975c\uff08\u975c\u5730\u85cf\uff09\uff1a\u7368\u7acb\u65bc\u60c5\u7dd2\u5916\u7684\u64cd\u4f5c\u7cfb\u7d71\u3001\u4e0d\u52d5\u5982\u5c71\u7684\u5b88\u6210\u8207\u7cbe\u795e\u529b\n* **\u7cbe\u795e\u529b\u70ba\u6210\u6557\u95dc\u9375**\uff1a\u7cbe\u795e\u5d29\u6f70\u5c31\u6703\u4e82\u505a\uff0c\u53c3\u8003\u4ea4\u6613\u61b2\u6cd5\uff0c\u4e0d\u8981\u5168\u51fa\u5168\u9032(\u907f\u514d\u904e\u5ea6\u4ea4\u6613)\uff0c\u9010\u6f38\u52a0\u5009\uff0c\u63db\u80a1\u6216\u96f6\u80a1\uff0c\u90fd\u53ef\u589e\u52a0\u7cbe\u795e\u8ca0\u8f09\u529b\n* **\u7368\u7acb\u65bc\u60c5\u7dd2\u5916\u7684\u64cd\u4f5c\u7cfb\u7d71**\uff1a\u4e0d\u8981\u8ddf\u8457\u5e02\u5834\u8dd1\uff0c\u4ee5\u70ba\u53ef\u4ee5\u9810\u6e2c\u800c\u505a\u9ede\u4ec0\u9ebc(\u904e\u5ea6\u4ea4\u6613)\uff0c\u800c\u662f\u5728\u60f3\u50cf\u4e16\u754c\u4e2d\u7684\u8ce0\u7387\u9ad8\u8655\u5148\u639b\u55ae\uff0c\u8b93\u771f\u5be6\u4e16\u754c\u4f86\u89f8\u767c\u3001\u8cbc\u5408\u8207\u6210\u4ea4\uff0c\u5118\u91cf\u5728\u8ce0\u7387\u9ad8\u8655\u9810\u639b(\u5148\u8a2d\u5b9a\u6bd4\u8f03\u5927\u500b\u7a7a\u9593\u518d\u8996\u60c5\u6cc1\u5fae\u8abf)\uff0c\u800c\u4e0d\u662f\u5e02\u50f9\u8cb7\u8ce3(\u5e02\u50f9\u8cb7\u8ce3\u662f\u9810\u6e2c\u611f\u89ba\u578b\u4ea4\u6613\uff0c\u5f88\u6158)\n* **\u675c\u7d55\u885d\u52d5\u8207\u4fdd\u6301\u8ddd\u96e2**\uff1a\n  * **\u7b49\u5f85\u7684\u85dd\u8853**\uff1a\u4ea4\u6613\u6709 8 \u6210\u7684\u6642\u9593\u662f\u5728\u7b49\u5f85\u5408\u9069\u7684\u6642\u6a5f\uff08\u8cfa\u53d6\u5927\u6ce2\u6bb5\u7684\u300c\u8cfa\u734e\u91d1\u300d\uff0c\u800c\u975e\u76e4\u4e2d\u7463\u788e\u7684\u300c\u8cfa\u85aa\u6c34\u300d\uff09\u3002\n  * **\u7981\u6b62\u76e4\u4e2d\u96a8\u6a5f\u4ea4\u6613**\uff1a\u7d55\u4e0d\u56e0\u70ba\u76e4\u4e2d\u50f9\u683c\u7684\u96a8\u6a5f\u8d77\u4f0f\u800c\u4efb\u610f\u8cb7\u8ce3\u3001\u8ffd\u9ad8\u6bba\u4f4e\u3002\u6240\u6709\u7684\u52d5\u4f5c\u5fc5\u9808\u4f9d\u7167\u8a08\u5283\u9810\u5148\u639b\u55ae\u5b8c\u6210\u3002\n  * **\u8ddd\u96e2\u611f**\uff1a\u8207\u76e4\u9762\u4fdd\u6301\u9069\u5ea6\u8ddd\u96e2\uff0c\u907f\u514d\u88ab\u77ed\u7dda\u96dc\u8a0a\u5e72\u64fe\u5fc3\u5883\u3002\n* **\u5b88\u8b77\u5229\u6f64\u8207\u90e8\u4f4d\u63a7\u5236**\uff1a\n  * **\u672a\u5be6\u73fe\u5229\u6f64\u7684\u5b9a\u529b**\uff1a\u52ff\u983b\u7e41\u66f4\u63db\u5f37\u52e2\u80a1\uff0c\u6df1\u523b\u7406\u89e3\u300c\u672a\u5be6\u73fe\u5229\u6f64\u6bd4\u5df2\u5be6\u73fe\u5229\u6f64\u66f4\u91cd\u8981\u300d\uff0c\u7d66\u4e88\u5f37\u52e2\u80a1\u8db3\u5920\u7684\u767c\u5c55\u7a7a\u9593\u3002\n  * **\u98a8\u96aa\u63a7\u5236\u539f\u5247**\uff1a\u8d0f\u52a0\u78bc\uff0c\u8f38\u64a4\u9000\u3002\u56b4\u683c\u63a7\u7ba1\u7e3d\u90e8\u4f4d\u8207\u55ae\u7b46\u98a8\u96aa\u3002\n* **\u505c\u640d\u7684\u85dd\u8853\uff08\u5b88\u898f\u8207\u7834\u77e9\uff09**\uff1a\n  * **\u7121\u7f6a\u63a8\u5b9a\u539f\u5247**\uff1a\u5728\u50f9\u683c\u672a\u89f8\u53ca\u5e95\u7dda\u7d05\u7dda\u524d\uff0c\u5118\u91cf\u7d66\u4e88\u5bec\u5bb9\u5ea6\uff0c\u907f\u514d\u88ab\u96a8\u6a5f\u6d17\u76e4\u6d17\u51fa\u5834\u3002\n  * **\u505c\u640d\u5f37\u5f31\u5206\u6cbb**\uff1a\u5f37\u52e2\u80a1\u505c\u640d\u8981\u5bec\uff08\u5bb9\u932f\u7a7a\u9593\u5927\uff09\uff0c\u5f31\u52e2\u80a1\u505c\u640d\u8981\u7a84\uff08\u82d7\u982d\u4e0d\u5c0d\u5373\u64a4\u9000\uff09\u3002\n  * **\u7d00\u5f8b\u8207\u5f48\u6027\u7684\u5e73\u8861**\uff1a\u505c\u640d\u662f\u6975\u9ad8\u7684\u85dd\u8853\u3002\u5fc5\u9808\u6b7b\u5b88\u7d00\u5f8b\uff0c\u4f46\u4e5f\u8981\u4fdd\u7559\u5f48\u6027\u8207\u5bb9\u932f\u7a7a\u9593\uff08\u4f8b\u5982\u5c07\u505c\u640d\u8a2d\u65bc\u7fa4\u773e\u60c5\u7dd2\u6eff\u6ea2\u7684\u6ce2\u6bb5\u9ad8\u4f4e\u9ede\uff09\uff0c\u4e0d\u8981\u7a92\u606f\u6301\u80a1\u7684\u751f\u547d\u529b\uff0c\u4ea6\u4e0d\u653e\u4efb\u8667\u640d\u64f4\u5927\u3002\n\n---\n\n## \u52c7\uff08\u884c\u666e\u8ce2\uff09\u2014\u2014 \u95dc\u9375\u50f9\u4f4d\u7684\u6a1e\u7d10\u51fa\u64ca\u8207\u57f7\u884c\n\n> **\u300c\u5728\u95dc\u9375\u7684\u6a1e\u7d10\u9ede\u9435\u8840\u57f7\u884c\uff0c\u4ee5\u8ce0\u7387\u70ba\u4e3b\u3001\u52dd\u7387\u70ba\u8f14\uff0c\u679c\u65b7\u51fa\u64ca\u3002\u300d**\n\n\u300c\u52c7\u666e\u8ce2\u300d\u6cd5\u9580\u5c6c\u65bc**\u51fa\u624b\u8207\u57f7\u884c\u968e\u6bb5**\u3002\u7576\u76e4\u9762\u51fa\u73fe\u95dc\u9375\u4fe1\u865f\uff0c\u4ea4\u6613\u8005\u5fc5\u9808\u6452\u9664\u6240\u6709\u6050\u61fc\u8207\u7336\u8c6b\uff0c\u50cf\u5916\u79d1\u624b\u8853\u822c\u7cbe\u6e96\u57f7\u884c\u4e0b\u55ae\u52d5\u4f5c\u3002\n\n* **\u6a1e\u7d10\u9ede\u51fa\u624b\u8207\u50f9\u683c 82 \u6cd5\u5247**\uff1a\n  * **\u50f9\u683c 82 \u6cd5\u5247**\uff1a\u4ea4\u6613\u8005\u4e00\u751f\u4e2d 80% \u7684\u5229\u6f64\u4f86\u81ea\u65bc 20% \u7684\u95dc\u9375\u4ea4\u6613\u3002\u56e0\u6b64\uff0c\u53ea\u5728\u5e02\u5834\u300c\u919e\u91c0\u3001\u653b\u64ca\u3001\u53cd\u6bba\uff08\u51fa\u624b\u8207\u505c\u640d\uff09\u3001\u5927\u51fa\u64ca\u300d\u7684\u95dc\u9375\u6a1e\u7d10\u9ede\u63a1\u53d6\u884c\u52d5\u3002\n  * **\u5f37\u52e2\u80a1\u62c9\u56de\u51fa\u624b**\uff1a\u5f37\u52e2\u80a1\u5927\u6f32\u5f8c\uff0c\u50c5\u5728\u300c\u62c9\u56de\u5371\u96aa\u9ede\u300d\u7684\u9ec3\u91d1\u7a97\u53e3\u9032\u884c\u9632\u5b88\u578b\u8cb7\u5165\uff0c\u4ee5\u9038\u5f85\u52de\u3002\n* **\u667a\u6167\u55ae\u7684\u9435\u8840\u57f7\u884c**\uff1a\n  * **\u8ce0\u7387\u70ba\u4e3b\uff0c\u52dd\u7387\u70ba\u8f14**\uff1a\u5229\u7528\u667a\u6167\u55ae\u5728\u5f37\u52e2\u80a1\u7684\u62c9\u56de\u5371\u96aa\u9ede\u9810\u5148\u639b\u55ae\u8cb7\u9032\uff0c\u4ee5\u535a\u53d6\u6975\u9ad8\u7684\u8ce0\u7387\u3002\n  * **\u5f31\u52e2\u80a1\u4e0d\u8cb7\u6216\u8f49\u5f37\u8cb7**\uff1a\u5f31\u52e2\u80a1\u539f\u5247\u4e0a\u4e0d\u78b0\uff1b\u82e5\u8981\u53c3\u8207\uff0c\u5fc5\u9808\u8a2d\u5b9a\u667a\u6167\u55ae\u5728\u5176\u300c\u7ad9\u4e0a\u8f49\u5f37\u9ede\u300d\u6642\u624d\u89f8\u767c\u8cb7\u5165\u3002\n  * **\u9632\u5b88\u540c\u6b65**\uff1a\u4efb\u4f55\u667a\u6167\u55ae\u4e00\u65e6\u89f8\u767c\u6210\u4ea4\uff0c\u5fc5\u9808**\u96a8\u5373\u639b\u51fa\u505c\u640d\u9632\u5b88\u55ae**\uff0c\u5805\u6c7a\u57f7\u884c\u300c\u6709\u8cfa\u4e0d\u8ce0\u300d\u7684\u4fdd\u672c\u539f\u5247\u3002\n* **\u90e8\u4f4d\u7ba1\u7406\u8207\u8cfa\u8ce0\u6bd4\u6975\u5927\u5316**\uff1a\n  * **\u5206\u6279\u9032\u51fa\u8207\u6c70\u5f31\u7559\u5f37**\uff1a\u8ce0\u9322\u55ae\u8981\u65e9\u65e9\u51fa\u5834\u4ee5\u63a7\u5236\u8667\u640d\uff1b\u8cfa\u9322\u55ae\u5247\u8981\u62b1\u5f97\u5920\u4e45\u3001\u665a\u9ede\u51fa\u5834\uff0c\u4e26\u5728\u8da8\u52e2\u78ba\u7acb\u6642\u9032\u884c\u69d3\u687f\u52a0\u78bc\uff0c\u4ee5\u6975\u5927\u5316\u8cfa\u8ce0\u6bd4\u3002\n  * **\u5fae\u89c0\u52d5\u4f5c\u7ba1\u7406**\uff1a\u843d\u5be6\u300c\u8f15\u5009\u653e\u5927\u300d\u3001\u300c\u5206\u5c64\u51fa\u624b\u300d\u3001\u300c\u90e8\u4f4d\u52a0\u6e1b\u78bc\u300d\u7b49\u63a7\u5009\u6280\u8853\u3002\n  * **\u95dc\u9375\u50f9\u8207\u6ce2\u52d5\u5ea6\u76e3\u63a7**\uff1a\u7dca\u76ef\u6574\u6578\u95dc\u5361\u3001\u5e73\u76e4\u7dda\u3001\u5927\u91cf\u5340\u7b49\u95dc\u9375\u652f\u6490\u58d3\u529b\u50f9\u4f4d\uff0c\u4e26\u5c0d\u5e02\u5834\u6ce2\u52d5\u5ea6\u4fdd\u6301\u9ad8\u5ea6\u654f\u611f\u3002\n  * **\u61c9\u6025\u8a08\u5283**\uff1a\u5728\u6bcf\u4e00\u6b21\u51fa\u624b\u524d\uff0c\u5927\u8166\u5fc5\u9808\u9810\u5148\u60f3\u597d\u6700\u58de\u7684\u60c5\u6cc1\u8207\u5c0d\u61c9\u7684\u61c9\u6025\u8a08\u5283\u3002\n  * **\u69d3\u687f\u61c9\u7528\u6642\u6a5f**\uff1a\u69d3\u687f\u552f\u4e00\u7684\u7528\u9014\u662f\u300c\u653e\u5927\u8cfa\u9322\u7684\u90e8\u4f4d\u300d\uff0c\u5728\u6709\u76c8\u5229\u4fdd\u8b77\u4e14\u8da8\u52e2\u660e\u6717\u6642\u679c\u65b7\u64f4\u5927\u6230\u679c\uff0c\u4e26\u6b7b\u5b88\u300c\u6709\u8cfa\u4e0d\u80fd\u8ce0\u300d\u7684\u5b89\u5168\u908a\u969b\u3002\n",
            "sanctuary-finger-2.md": "# \u6d41\u6d3e\uff1a\u8f49\u6298\u6d3e\u8207\u9806\u52e2\u6d3e\n\n\u4e16\u754c\u4e0a\u5c31\u5169\u500b\u6d41\u6d3e\uff0c\u8f49\u6298\u6d3e\u8ddf\u9806\u52e2\u6d3e\uff1a\n\n## \u8f49\u6298\u6d3e\n- **\u7279\u6027**\uff1a\u52dd\u7387\u4f4e\uff0c\u8ce0\u7387\u9ad8\uff0c\u6574\u5929\u731c\u982d\u6478\u5e95\u3002\n- **\u75db\u9ede**\uff1a\u56e0\u70ba\u5f88\u96e3\u731c\uff0c\u731c\u5c0d\u4e4b\u524d\u5e38\u53d7\u50b7\u6158\u91cd\u3002\u6bd4\u5982\u8aaa\u8981\u731c\u570b\u5de8\u5e95\u90e8\uff0c\u8981\u525b\u597d\u731c\u5230\u6975\u5176\u56f0\u96e3\uff1a\u4e0b\u5f71\u7dda\uff0c\u8cb7\uff1b\u5230\u6708\u7dda\uff0c\u8cb7\uff1b\u7834\u5b63\u7dda\uff0c\u8cb7\uff1b\u7834\u534a\u5e74\u7dda\uff0c\u8cb7\u3002\u53ea\u8981\u9322\u5920\uff0c\u67d0\u5929\u4e00\u5b9a\u731c\u4e2d\u3002\n- **\u9069\u7528\u5c0d\u8c61**\uff1a\u9069\u5408\u6295\u8cc7\u800c\u975e\u6295\u6a5f\uff0c\u4e5f\u9069\u5408\u9322\u591a\u7684\u3002\n- **\u4ea4\u6613\u4fee\u7149**\uff1a\u9019\u500b\u6d41\u6d3e\u5fc5\u9808\u56b4\u63a7\u90e8\u4f4d\uff0c\u7df4\u597d\u505c\u640d\u3002\u52dd\u7387\u4f4e\uff0c\u5341\u6b21\u4e2d\u4e00\u6b21\uff0c\u4f46\u90a3\u4e00\u6b21\u6703\u5927\u8cfa\u3002\n- **\u500b\u6027\u8981\u6c42**\uff1a\u500b\u6027\u4e0a\u9069\u5408\u8ced\u5f92\u6027\u683c\uff0c\u8f03\u8070\u660e\uff0c\u559c\u6b61\u8207\u773e\u4e0d\u540c\uff0c\u4f8b\u5982\u9ea5\u514b\u8c9d\u745e\u3002\u6297\u58d3\u6027\u8981\u5f88\u9ad8\uff0c\u56e0\u70ba\u8f49\u6298\u90fd\u662f\u9006\u52e2\u3002\n\n## \u9806\u52e2\u6d3e\n- **\u7279\u6027**\uff1a\u5b8c\u5168\u81e3\u670d\u5e02\u5834\uff0c\u653e\u68c4\u731c\u982d\u6478\u5e95\u3002\n- **\u9810\u4f30**\uff1a\u5341\u6b21\u6703\u932f\u5169\u6b21\uff0c\u5c31\u662f\u982d\u90e8\u8207\u5e95\u90e8\u6703\u932f\u904e\uff0c\u4f46 8 \u6b21\u90fd\u662f\u5c0d\u7684\u3002\n- **\u5fc3\u614b**\uff1a\u52dd\u7387\u9ad8\uff0c\u8ce0\u7387\u5c31\u6bd4\u8f03\u5dee\uff0c\u53ea\u8cfa\u6ce2\u6bb5 50%\u3002\u4e5f\u4e0d\u53bb\u554f\u300c\u61c9\u8a72\u300d\u5982\u4f55\uff0c\u800c\u662f\u73fe\u5728\u300c\u662f\u300d\u5982\u4f55\u3002\n",
            "sanctuary-finger-3.md": "# \u4e0b\u8dcc\u8a72\u52a0\u78bc\u6216\u6e1b\u78bc\uff1f\n\n\u91dd\u5c0d\u9019\u500b\u554f\u984c\uff0c\u4e0d\u540c\u8cc7\u91d1\u898f\u6a21\u7684\u4ea4\u6613\u8005\u6709\u8457\u622a\u7136\u4e0d\u540c\u7684\u64cd\u4f5c\u54f2\u5b78\uff1a\n\n## \u9322\u5c11\u7684\u4ea4\u6613\u8005\n- **\u4e3b\u5f35**\uff1a\u6e1b\u78bc\u3002\n- **\u64cd\u4f5c\u65b9\u6cd5**\uff1a\u4e0d\u4e00\u5b9a\u662f\u4eca\u5929\uff0c\u512a\u5148\u9078\u7dda\u578b\u919c\u7684\uff08\u4ee3\u8868\u4e0a\u9762\u5957\u7262\u8ce3\u58d3\u91cd\uff09\u5148\u6e1b\uff0c\u56e0\u70ba\u4f60\u4e0d\u8ce3\uff0c\u5225\u4eba\u6703\u8ce3\u3002\n- **\u8b66\u8a9e**\uff1a\u4f46\u4e5f\u6709\u53ef\u80fd\u8ce3\u5149\u7c4c\u78bc\u4e7e\u6de8\u5f8c\uff0c\u4e3b\u529b\u4e00\u8def\u62c9\u4e0a\u53bb\u3002\u80a1\u5e02\u6c92\u4ec0\u9ebc\u4e0d\u53ef\u80fd\uff0c\u6211\u5011\u53ea\u80fd\u9078\u64c7\u6a5f\u7387\u9ad8\u7684\u505a\u6cd5\u3002\n\n## \u9322\u591a\u7684\u4ea4\u6613\u8005\n- **\u4e3b\u5f35**\uff1a\u4e00\u5f8b\u6295\u8cc7\u5de6\u5074\u4ea4\u6613\u3002\n- **\u64cd\u4f5c\u65b9\u6cd5**\uff1a\u6c38\u9060\u53ea\u6709\u52a0\u78bc\u9078\u9805\uff0c\u672c\u591a\u7d42\u52dd\u3002\n\n---\n\n## \u7e3d\u7d50\n\u9019\u7a2e\u554f\u984c\u6839\u672c\u6c92\u6709\u6a19\u6e96\u7b54\u6848\uff0c\u8aaa\u6709\u7b54\u6848\u7684\u90fd\u662f\u9a19\u5b50\u3002\n"
        };

        // Page Initialization
        window.addEventListener('load', () => {
            loadCatalogData();
        });

        function loadCatalogData() {
            // Render default list immediately
            renderCatalog(fingerArticles);

            // Fetch external JSON for updates with multi-path fallback
            fetch('sanctuary-finger.json')
                .then(res => res.ok ? res : fetch('./sanctuary-finger.json'))
                .then(res => res.ok ? res : fetch('/sanctuary-finger.json'))
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        fingerArticles = data;
                        renderCatalog(fingerArticles);
                    }
                    handleRouting();
                })
                .catch(err => {
                    console.warn("使用內建指月錄目錄資料:", err);
                    handleRouting();
                });
        }

        function handleRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            if (articleId) {
                loadArticle(articleId);
            } else {
                showCatalogView();
            }
        }

        function navigateToCatalog() {
            history.pushState(null, '', 'stock-finger.html?view=catalog');
            showCatalogView();
        }

        function navigateToArticle(id) {
            history.pushState(null, '', `stock-finger.html?id=${id}`);
            loadArticle(id);
        }

        function showCatalogView() {
            document.getElementById('detailView').classList.remove('active');
            document.getElementById('catalogView').classList.add('active');
            document.title = "股海指月錄 | 股海學習";
        }

        function showDetailView() {
            document.getElementById('catalogView').classList.remove('active');
            document.getElementById('detailView').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCatalog(articles) {
            const container = document.getElementById('itemListContainer');
            if (!container) return;
            container.innerHTML = '';

            articles.forEach(article => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => navigateToArticle(article.id);

                card.innerHTML = `
                    <div class="item-info">
                        <h3>${article.title}</h3>
                        <p class="item-desc">${article.description}</p>
                    </div>
                    <div class="item-date">${article.date}</div>
                `;
                container.appendChild(card);
            });
        }

        function loadArticle(articleId) {
            const articleObj = fingerArticles.find(a => a.id === articleId);
            if (!articleObj) {
                showCatalogView();
                return;
            }

            document.getElementById('activeTitle').textContent = articleObj.title;
            document.getElementById('activeDate').textContent = `發布日期：${articleObj.date}`;
            showDetailView();

            // Render built-in fallback content immediately (0ms instant display!)
            if (fallbackFingerMarkdownMap[articleObj.filename]) {
                renderArticleMarkdown(fallbackFingerMarkdownMap[articleObj.filename]);
            } else {
                document.getElementById('activeContent').innerHTML = "<p style='color: var(--text-secondary);'>文章內容載入中...</p>";
            }

            // Attempt fetching external file for any dynamic updates
            fetch(articleObj.filename)
                .then(res => res.ok ? res : fetch('./' + articleObj.filename))
                .then(res => res.ok ? res : fetch('/' + articleObj.filename))
                .then(res => res.ok ? res.text() : null)
                .then(markdownText => {
                    if (markdownText) {
                        renderArticleMarkdown(markdownText);
                    }
                })
                .catch(err => {
                    console.warn("使用內建備份文章快取");
                });
        }

                function renderArticleMarkdown(text) {
            const contentArea = document.getElementById('activeContent');
            contentArea.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = 'detail-content-area';

            let normalizedText = text;
            if (normalizedText.includes('\\n')) {
                normalizedText = normalizedText.replace(/\\n/g, '\n');
            }
            const lines = normalizedText.split('\n');
            let delay = 0;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();

                if (trimmed.startsWith('# ')) continue;

                if (trimmed === '') {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'detail-empty-line';
                    wrapper.appendChild(lineDiv);
                    continue;
                }

                if (trimmed.startsWith('#')) {
                    const levelMatch = trimmed.match(/^#+/);
                    if (levelMatch) {
                        const level = levelMatch[0].length;
                        const headingText = trimmed.replace(/^#+\s+/, '');
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'detail-line';
                        lineDiv.style.fontWeight = '700';
                        lineDiv.style.color = 'var(--text-primary)';
                        lineDiv.style.marginTop = level === 2 ? '36px' : level === 3 ? '28px' : '22px';
                        lineDiv.style.marginBottom = '10px';

                        let formattedHeading = headingText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        lineDiv.innerHTML = formattedHeading;

                        if (level === 2) {
                            lineDiv.style.fontSize = '1.5rem';
                            lineDiv.style.borderBottom = '1px solid var(--border-color)';
                            lineDiv.style.paddingBottom = '6px';
                        } else if (level === 3) {
                            lineDiv.style.fontSize = '1.3rem';
                            lineDiv.style.color = 'var(--accent-gold)';
                        } else {
                            lineDiv.style.fontSize = '1.15rem';
                        }

                        lineDiv.style.animationDelay = `${delay}s`;
                        delay += 0.03;
                        wrapper.appendChild(lineDiv);
                        continue;
                    }
                }

                if (trimmed === '---') {
                    const hr = document.createElement('hr');
                    hr.style.border = 'none';
                    hr.style.borderTop = '1px solid var(--border-color)';
                    hr.style.margin = '30px 0';
                    wrapper.appendChild(hr);
                    continue;
                }

                if (trimmed.startsWith('![')) {
                    const match = trimmed.match(/^!\[(.*?)\]\((.*?)\)$/);
                    if (match) {
                        const img = document.createElement('img');
                        img.src = match[2];
                        img.alt = match[1];
                        img.style.maxWidth = '100%';
                        img.style.display = 'block';
                        img.style.margin = '30px auto 10px auto';
                        img.style.borderRadius = '12px';
                        img.style.boxShadow = 'var(--shadow-sm)';
                        img.style.opacity = '0';
                        img.style.transform = 'translateY(15px)';
                        img.style.animation = 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                        img.style.animationDelay = `${delay}s`;
                        delay += 0.03;
                        wrapper.appendChild(img);
                        continue;
                    }
                }

                let isQuote = false;
                let cleanLine = trimmed;
                if (trimmed.startsWith('>')) {
                    isQuote = true;
                    cleanLine = trimmed.replace(/^>\s*/, '').trim();
                }

                if (cleanLine.startsWith('[!')) {
                    const alertType = cleanLine.match(/\[!(.*?)\]/);
                    if (alertType) {
                        const typeText = alertType[1] === 'NOTE' ? '注意' : alertType[1] === 'TIP' ? '提示' : alertType[1] === 'IMPORTANT' ? '重要' : alertType[1] === 'DANGER' ? '警示' : alertType[1];
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'detail-line';
                        lineDiv.style.fontWeight = 'bold';
                        lineDiv.style.color = 'var(--accent-gold)';
                        lineDiv.style.marginTop = '15px';
                        lineDiv.innerHTML = `<i class="bi bi-info-circle-fill"></i> ${typeText}：`;
                        lineDiv.style.animationDelay = `${delay}s`;
                        delay += 0.03;
                        wrapper.appendChild(lineDiv);
                        continue;
                    }
                }

                const lineDiv = document.createElement('div');
                lineDiv.className = 'detail-line';

                let displayText = cleanLine;
                let listIndent = 0;

                if (cleanLine.startsWith('- ')) {
                    displayText = '• ' + cleanLine.substring(2);
                    listIndent = 20;
                } else if (cleanLine.match(/^\d+\.\s/)) {
                    const match = cleanLine.match(/^(\d+\.\s)(.*)/);
                    if (match) {
                        displayText = match[1] + match[2];
                        listIndent = 20;
                    }
                } else if (cleanLine.match(/^\*\s/)) {
                    displayText = '• ' + cleanLine.substring(2);
                    listIndent = 20;
                }

                const leadingSpaces = line.match(/^(\s+)/);
                if (leadingSpaces) {
                    listIndent += leadingSpaces[1].length * 6;
                }

                if (listIndent > 0) {
                    lineDiv.style.paddingLeft = `${listIndent}px`;
                }

                let formattedText = displayText
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                lineDiv.innerHTML = formattedText;

                if (isQuote) {
                    lineDiv.style.borderLeft = '3px solid var(--accent-gold)';
                    lineDiv.style.paddingLeft = '15px';
                    lineDiv.style.color = 'var(--text-secondary)';
                    lineDiv.style.fontStyle = 'italic';
                }

                lineDiv.style.animationDelay = `${delay}s`;
                delay += 0.03;
                wrapper.appendChild(lineDiv);
            }

            contentArea.appendChild(wrapper);
            document.title = `${document.getElementById('activeTitle').textContent} | 股海指月錄`;
        }
    </script>
</body>
</html>
